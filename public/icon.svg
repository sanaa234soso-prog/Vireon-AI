<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="vGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- App Icon Background rounded -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#10b981" stroke-width="8" stroke-opacity="0.3"/>
  
  <!-- Outer Tech Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#10b981" stroke-width="4" stroke-dasharray="16 12" stroke-opacity="0.4"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#059669" stroke-width="2" stroke-opacity="0.6"/>
  
  <!-- Core Vireon 'V' Symbol -->
  <path d="M140 160 L256 380 L372 160 L310 160 L256 280 L202 160 Z" fill="url(#vGrad)" filter="url(#glow)"/>
  
  <!-- Central Pulse Core -->
  <circle cx="256" cy="230" r="16" fill="#6ee7b7" filter="url(#glow)"/>
  
  <!-- Small Status Nodes -->
  <circle cx="256" cy="76" r="10" fill="#10b981"/>
  <circle cx="256" cy="436" r="10" fill="#10b981"/>
  <circle cx="76" cy="256" r="10" fill="#10b981"/>
  <circle cx="436" cy="256" r="10" fill="#10b981"/>
</svg>
